pages.encuesta = () => {
  const sv = S.survey, n = SURVEY.length, isRes = sv.step === n;
  const totals = {Scrum:0,Kanban:0,Cascada:0};
  sv.answers.forEach((a,i)=>{ if(a!==null){ const sc = SURVEY[i].o[a][1]; for(const k in sc) totals[k]+=sc[k]; } });
  const tot = totals.Scrum+totals.Kanban+totals.Cascada;
  const res = Object.keys(totals).map(k=>({name:k, score:totals[k], pct: tot?Math.round(totals[k]/tot*100):0})).sort((a,b)=>b.score-a.score);
  const prog = isRes ? 100 : (sv.step+1)/n*100;
  const desc = {
    Scrum:"Tu proyecto se beneficiaría de ciclos breves, objetivos claros y revisión frecuente.",
    Kanban:"Tu proyecto necesita flexibilidad, visibilidad y una gestión continua del flujo.",
    Cascada:"Tu proyecto valora la previsibilidad, la documentación y una secuencia de fases definida."
  };
  let body;
  if (isRes) {
    body = `<p class="tag">Tu mejor coincidencia</p><h2 class="h2b" style="font-size:40px">${res[0].name}</h2>
      <p class="ctx">${desc[res[0].name]}</p>
      <div class="res-bars">${res.map(r=>`<div><p><strong>${r.name}</strong><span>${r.pct}%</span></p><div class="t"><span style="width:${r.pct}%"></span></div></div>`).join("")}</div>
      <button class="btn solid" data-act="surveyReset">Repetir encuesta</button>`;
  } else {
    const q = SURVEY[sv.step], cur = sv.answers[sv.step];
    body = `<p class="tag">Sobre tu proyecto</p><h2>${q.q}</h2><p class="ctx">${q.c}</p>
      <div class="opts" role="radiogroup">
        ${q.o.map((o,i)=>`<button class="opt ${cur===i?"on":""}" role="radio" aria-checked="${cur===i}" data-act="surveyAns" data-v="${i}"><span>${String.fromCharCode(65+i)}</span>${o[0]}<i></i></button>`).join("")}
      </div>
      <div class="sv-actions">
        <button class="btn" data-act="surveyNav" data-v="-1" ${sv.step===0?"disabled":""}>Anterior</button>
        <button class="btn solid" data-act="surveyNav" data-v="1" ${cur===null?"disabled":""}>${sv.step===n-1?"Ver resultado":"Siguiente"} ${ARROW}</button>
      </div>`;
  }
  return pageIntro("Metodologías","Encuesta de preferencias",`
  <p class="topic-intro">Responde cinco preguntas sobre tu proyecto y descubre qué enfoque se ajusta mejor a sus necesidades.</p>
  <div class="survey">
    <div class="sv-prog"><div class="top"><span>${isRes?"Resultado":"Pregunta "+(sv.step+1)}</span><strong>${isRes?"Análisis completo":(sv.step+1)+" de "+n}</strong></div>
      <div class="bar"><span style="width:${prog}%"></span></div></div>
    <div class="sv-body">${body}</div>
  </div>`);
};

  "metodologias/encuesta": pages.encuesta,
  "recursos/glosario": pages.glosario,
  "recursos/preguntas-frecuentes": pages["preguntas-frecuentes"],
  "recursos/enlaces": pages.enlaces,
  "recursos/ejercicios": pages.ejercicios,
  "sobre-nosotros": pages["sobre-nosotros"],
  "contacto": pages.contacto
};

function currentRoute(){ return location.hash.replace(/^#\/?/,"").replace(/\/$/,""); }

function render(){
  const r = currentRoute();
  const fn = ROUTES[r] || ROUTES[""];
  $("#app").innerHTML = fn();
  document.querySelectorAll("#barra a").forEach(a=>a.classList.toggle("current", a.getAttribute("href")===("#/"+r).replace("#/","#/")));
  $("#menuNav").querySelectorAll(".menu-group").forEach(g=>{
    g.classList.toggle("is-active", g.dataset.group===groupOf(r));
  });
  if (!/^#\/(sdlc)?/.test(location.hash)) {}
  window.scrollTo({top:0});
}

function groupOf(r){
  if (r==="") return "Inicio";
  if (r.startsWith("calidad")) return "Calidad";
  if (r.startsWith("procesos")) return "Procesos";
  if (r.startsWith("metodologias")) return "Metodologías";
  if (r.startsWith("recursos")) return "Recursos";
  if (r==="contacto"||r==="sobre-nosotros") return "Nosotros";
  return "";
}

/* ---------- MENÚ Y BARRA ---------- */
$("#menuNav").innerHTML = MENU.map((m,i)=>`<div class="menu-group" data-group="${m.label}">
  <button type="button" aria-expanded="false"><span>0${i+1}</span>${m.label}<span class="menu-plus" aria-hidden="true"></span></button>
  <div class="submenu">${m.options.map(o=>`<a href="${o.href}">${o.label}${ARROW}</a>`).join("")}</div></div>`).join("");
$("#barra").innerHTML = BAR.map(b=>`<a href="${b[1]}">${b[0]}</a>`).join("");

function setMenu(open){
  $("#menuPanel").classList.toggle("is-open",open);
  $("#backdrop").classList.toggle("is-open",open);
  $("#menuPanel").setAttribute("aria-hidden",!open);
  const b=$("#btnMenu"); b.classList.toggle("is-open",open); b.setAttribute("aria-expanded",open);
  document.body.style.overflow = open ? "hidden" : "";
}
function setSearch(open){
  $("#searchPanel").classList.toggle("is-open",open);
  $("#btnSearch").setAttribute("aria-expanded",open);
  if (open) $("#siteSearch").focus();
}

$("#btnMenu").addEventListener("click",()=>{ setSearch(false); setMenu(!$("#menuPanel").classList.contains("is-open")); });
$("#btnSearch").addEventListener("click",()=>{ setMenu(false); setSearch(!$("#searchPanel").classList.contains("is-open")); });
$("#backdrop").addEventListener("click",()=>setMenu(false));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ setMenu(false); setSearch(false); } });

document.getElementById("menuNav").addEventListener("click",e=>{
  const btn = e.target.closest(".menu-group > button");
  if (btn){ const g=btn.parentElement; const open=!g.classList.contains("is-expanded");
    document.querySelectorAll(".menu-group").forEach(x=>x.classList.remove("is-expanded"));
    g.classList.toggle("is-expanded",open); btn.setAttribute("aria-expanded",open); return; }
  if (e.target.closest(".submenu a")) setMenu(false);
});

$("#siteSearch").addEventListener("input",e=>{
  const q = norm(e.target.value.trim());
  const box = $("#searchResults");
  if (!q){ box.innerHTML=""; return; }
  const items = [];
  MENU.forEach(m=>m.options.forEach(o=>{ if(norm(o.label).includes(q)) items.push(o); }));
  GLOSSARY.forEach(g=>{ if(norm(g[0]+" "+g[1]).includes(q)) items.push({label:"Glosario: "+g[0], href:"#/recursos/glosario"}); });
  box.innerHTML = items.slice(0,8).map(i=>`<a href="${i.href}">${i.label}</a>`).join("") || '<span style="font-size:13px">Sin resultados</span>';
});
document.getElementById("searchResults").addEventListener("click",()=>setSearch(false));

/* ---------- INTERACCIONES (delegación) ---------- */
$("#app").addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch(act){
    case "std": S.standard=v; break;
    case "test": S.testOpen = S.testOpen===v ? null : v; break;
    case "tool": S.toolFilter=v; break;
    case "sdlc": S.sdlc=+v; break;
    case "sdlcNav": S.sdlc=Math.min(SDLC.length-1,Math.max(0,S.sdlc+ +v)); break;
    case "scrumTopic": S.scrumTopic=v; break;
    case "ev": S.ev=+v; break;
    case "weeks": S.weeks=+v; break;
    case "kanbanNav": S.kanban=Math.min(2,Math.max(0,S.kanban+ +v)); break;
    case "method": S.methods = S.methods.includes(v) ? S.methods.filter(x=>x!==v) : [...S.methods,v]; break;
    case "surveyAns": S.survey.answers[S.survey.step]=+v; break;
    case "surveyNav": S.survey.step=Math.min(SURVEY.length,Math.max(0,S.survey.step+ +v)); break;
    case "surveyReset": S.survey={step:0,answers:[null,null,null,null,null]}; break;
    case "faq": S.faq = S.faq===+v ? null : +v; break;
    case "exSol": S.exercise = S.exercise===+v ? null : +v; break;
  }
  if (act==="ev" || act==="weeks" || act==="kanbanNav" || act==="sdlcNav" || act==="sdlc" || act==="surveyNav" || act==="surveyAns" || act==="surveyReset" || act==="method" || act==="scrumTopic" || act==="std" || act==="test" || act==="tool" || act==="faq" || act==="exSol") {
    const scrollY = window.scrollY; render(); window.scrollTo({top:scrollY});
  }
});

$("#app").addEventListener("input", e=>{
  if (e.target.id==="glossSearch"){
    S.glossQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const inp = $("#glossSearch"); inp.focus(); inp.setSelectionRange(pos,pos);
  }
});

$("#app").addEventListener("change", e=>{
  if (e.target.matches(".picker input")) return;
});

$("#app").addEventListener("submit", e=>{
  if (e.target.id!=="contactForm") return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target).entries());
  const err = {};
  const name=(d.name||"").trim(), email=(d.email||"").trim(), subject=(d.subject||"").trim(), message=(d.message||"").trim();
  if(!name) err.name="Ingresa tu nombre.";
  if(!email) err.email="Ingresa tu correo electrónico."; else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) err.email="Escribe un correo con formato válido.";
  if(!subject) err.subject="Indica el tema de tu consulta.";
  if(!message) err.message="Escribe tu consulta o comentario."; else if(message.length<10) err.message="El mensaje debe tener al menos 10 caracteres.";
  S.contactErrors = err;
  S.contactSent = Object.keys(err).length===0;
  render();
});

window.addEventListener("hashchange",()=>{ setMenu(false); setSearch(false); render(); });

/* ---------- INICIO ---------- */
render();
</script>
</body>
</html>
